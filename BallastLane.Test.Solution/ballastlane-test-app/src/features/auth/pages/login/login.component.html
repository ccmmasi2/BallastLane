<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <div class="login-header">
        <mat-icon class="logo-icon">receipt</mat-icon>
        <mat-card-title>BallastLane</mat-card-title>
        <mat-card-subtitle>Sign in to your account</mat-card-subtitle>
      </div>
    </mat-card-header>

    <mat-card-content>
      <mat-card *ngIf="errorMessage" class="error-card">
        <mat-card-content>
          <p class="error-text">{{ errorMessage }}</p>
        </mat-card-content>
      </mat-card>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email: "CristianMontenegro&#64;test.com"</mat-label>
          <mat-icon matPrefix>email</mat-icon>
          <input matInput type="email" formControlName="email" autocomplete="username" />
  
          <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required.</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Enter a valid email address.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password: "password123"</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password" />
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
 
          <mat-error *ngIf="form.get('password')?.hasError('required')">Password is required.</mat-error>
          <mat-error *ngIf="form.get('password')?.hasError('minlength')">At least 6 characters required.</mat-error>
        </mat-form-field>

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="submit-btn"
          [disabled]="isLoading">
          <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
          <span *ngIf="!isLoading">Sign In</span>
        </button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
