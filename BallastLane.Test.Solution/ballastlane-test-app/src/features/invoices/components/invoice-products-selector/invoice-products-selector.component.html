<div class="selector-container">
  <mat-form-field appearance="outline" class="selector-field">
    <mat-label>Select a product to add</mat-label>
    <mat-select [formControl]="productCtrl">
      <mat-option *ngFor="let p of products" [value]="p.id">
        {{ p.name }}
        <span class="product-price">{{ p.price | currency:'USD':'symbol':'1.2-2' }}</span>
      </mat-option>
    </mat-select>
  </mat-form-field>

  <button
    mat-flat-button
    color="accent"
    type="button"
    [disabled]="!productCtrl.value"
    (click)="onAdd()">
    <mat-icon>add</mat-icon>
    Add Product
  </button>
</div>
