<mat-card class="category-card">
  <mat-card-header>
    <mat-card-title>{{ category.name }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p class="description">{{ category.description ?? '—' }}</p>
  </mat-card-content>
  <mat-card-actions align="end">
    <button mat-icon-button color="primary" matTooltip="Edit" (click)="onEdit()">
      <mat-icon>edit</mat-icon>
    </button>
    <button mat-icon-button color="warn" matTooltip="Delete" (click)="onDelete()">
      <mat-icon>delete</mat-icon>
    </button>
  </mat-card-actions>
</mat-card>
