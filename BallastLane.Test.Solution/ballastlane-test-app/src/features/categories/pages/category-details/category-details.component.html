<div class="page-container">
  <div class="page-header">
    <button mat-icon-button matTooltip="Back to list" (click)="onBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>Category Details</h1>
    <div class="header-actions" *ngIf="category">
      <button mat-stroked-button (click)="onEdit()">
        <mat-icon>edit</mat-icon>
        Edit
      </button>
      <button mat-stroked-button color="warn" (click)="onDelete()">
        <mat-icon>delete</mat-icon>
        Delete
      </button>
    </div>
  </div>

  <app-loading-spinner [isLoading]="isLoading" message="Loading category..."></app-loading-spinner>

  <mat-card *ngIf="errorMessage" class="error-card">
    <mat-card-content>
      <p class="error-text">{{ errorMessage }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button color="primary" (click)="onBack()">Back to list</button>
    </mat-card-actions>
  </mat-card>

  <mat-card *ngIf="category && !isLoading" class="detail-card">
    <mat-card-header>
      <mat-card-title>{{ category.name }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>

      <div class="field-row">
        <span class="field-label">Name</span>
        <span class="field-value">{{ category.name }}</span>
      </div>

      <mat-divider></mat-divider>

      <div class="field-row">
        <span class="field-label">Description</span>
        <span class="field-value description">{{ category.description ?? '—' }}</span>
      </div>

    </mat-card-content>
  </mat-card>
</div>
