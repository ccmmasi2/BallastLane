<div class="page-container">
  <div class="page-header">
    <h1>{{ isEditMode ? 'Edit Category' : 'New Category' }}</h1>
  </div>

  <app-loading-spinner [isLoading]="isLoading" message="Loading category..."></app-loading-spinner>

  <mat-card *ngIf="errorMessage" class="error-card">
    <mat-card-content>
      <p class="error-text">{{ errorMessage }}</p>
    </mat-card-content>
  </mat-card>

  <mat-card *ngIf="!isLoading">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" placeholder="Category name" maxlength="100" />
          <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required.</mat-error>
          <mat-error *ngIf="form.get('name')?.hasError('minlength')">
            Name must be at least 2 characters.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea
            matInput
            formControlName="description"
            placeholder="Optional description"
            rows="4"
            maxlength="500">
          </textarea>
          <mat-error *ngIf="form.get('description')?.hasError('maxlength')">
            Description cannot exceed 500 characters.
          </mat-error>
        </mat-form-field>

        <div class="form-actions">
          <button mat-button type="button" (click)="onCancel()">Cancel</button>
          <button mat-flat-button color="primary" type="submit" [disabled]="isSaving">
            {{ isSaving ? 'Saving...' : (isEditMode ? 'Update' : 'Create') }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
