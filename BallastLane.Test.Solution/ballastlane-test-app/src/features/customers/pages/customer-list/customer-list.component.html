<div class="page-container">
  <div class="page-header">
    <h1>Customers</h1>
    <button mat-flat-button color="primary" (click)="onCreate()">
      <mat-icon>add</mat-icon>
      New Customer
    </button>
  </div>

  <mat-card *ngIf="errorMessage" class="error-card">
    <mat-card-content>
      <p class="error-text">{{ errorMessage }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button color="primary" (click)="loadCustomers()">Retry</button>
    </mat-card-actions>
  </mat-card>

  <app-customer-table
    [customers]="customers"
    [isLoading]="isLoading"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)">
  </app-customer-table>
</div>
